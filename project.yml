name: BastionRush
options:
  bundleIdPrefix: com.rosstoma
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FMQ2H9F8WV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    INFOPLIST_KEY_CFBundleDisplayName: Bastion Rush
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.strategy-games
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    TARGETED_DEVICE_FAMILY: 1
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
targets:
  BastionRush:
    type: application
    platform: iOS
    sources:
      - path: BastionRush
        excludes:
          - "Resources/Preview Content"
    resources:
      - path: BastionRush/Resources
        excludes:
          - "Preview Content"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rosstoma.BastionRush
        PRODUCT_NAME: BastionRush
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        SUPPORTS_MACCATALYST: NO
    configFiles:
      Debug: Config/Config.xcconfig
      Release: Config/Config.xcconfig
  BastionRushTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BastionRushTests]
    dependencies:
      - target: BastionRush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rosstoma.BastionRushTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BastionRush:
    build:
      targets:
        BastionRush: all
        BastionRushTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/BastionRush.storekit
    test:
      config: Debug
      targets:
        - BastionRushTests
    archive:
      config: Release
